name: Build Kernel-1

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename (e.g., lmi, umi)'
        required: true
        default: 'lmi'
        type: choice
        options:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa

      script:
        description: 'Select Build Script'
        required: true
        default: 'build.sh'
        type: choice
        options:
          - build.sh
          - build-miui.sh

      ksu:
        description: 'Enable ReSukiSU Latest + SELinux Hide'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel-1 for ${{ inputs.device }} (${{ inputs.script }}) (${{ inputs.ksu && 'ReSukiSU' || 'NoKSU' }})
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_DIR: $HOME/zyc-clang
      DEFCONFIG: arch/arm64/configs/${{ inputs.device }}_defconfig

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

      - name: Setup Cache (ccache)
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache_mikernel
          key: kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-${{ github.run_id }}
          restore-keys: |
            kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-
            kernel-ccache-${{ inputs.device }}-
            kernel-ccache-

      - name: Setup Toolchain (ZyC-Clang 16)
        run: |
          mkdir -p $TOOLCHAIN_DIR
          cd $TOOLCHAIN_DIR
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          tar -zxvf Clang-16.0.6-20260510.tar.gz
          echo "PATH=$TOOLCHAIN_DIR/bin:$PATH" >> $GITHUB_ENV

      # 集成最新ReSukiSU + 写入SELinux隐藏配置（无EOF heredoc，零语法报错）
      - name: Inject Latest ReSukiSU & SELinux Hide Config
        if: inputs.ksu == true
        run: |
          echo "Pull latest ReSukiSU source"
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash

          echo "Append ReSukiSU SELinux hide config to ${{ env.DEFCONFIG }}"
          echo "# ReSukiSU Core SELinux Hide Switch" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KSU=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KSU_MANAGER=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KSU_SUSFS=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KSU_HIDE_SELINUX=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KSU_SPOOF_GETENFORCE=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_HIDE_SELINUX_CMDLINE=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_SUSFS_HIDE_SELINUX_FS=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_SELINUX_PERMISSIVE_DEFAULT=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KPROBES=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_HAVE_KPROBES=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KPROBE_EVENTS=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KALLSYMS=y" >> ${{ env.DEFCONFIG }}
          echo "CONFIG_KALLSYMS_ALL=y" >> ${{ env.DEFCONFIG }}

          echo "Verify injected config"
          grep CONFIG_KSU ${{ env.DEFCONFIG }}

      - name: Build Kernel
        run: |
          chmod +x build.sh build-miui.sh
          echo "Build Script: ${{ inputs.script }}"
          echo "Device: ${{ inputs.device }}"
          if [ "${{ inputs.ksu }}" = "true" ]; then
            echo "Build with ReSukiSU Latest + SELinux Hide"
            bash ${{ inputs.script }} ${{ inputs.device }} ksu
          else
            echo "Build without KSU"
            bash ${{ inputs.script }} ${{ inputs.device }}
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Kernel1-${{ inputs.device }}-${{ github.run_number }}
          path: ./*.zip
          if-no-files-found: error
